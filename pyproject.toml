[project]
name = "dsa-vn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "vnstock>=4.0.5",
    "anthropic>=0.69",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
